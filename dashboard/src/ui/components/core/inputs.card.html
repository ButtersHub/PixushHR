<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } }</script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 14px 16px; background: var(--surface-app); font-family: var(--font-sans); }
  .section { margin-bottom: 14px; }
  .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); margin-bottom: 8px; }
  .row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Textarea } = window.PixushHRDesignSystem_358ac3;

const SearchIcon = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
);

function Demo() {
  return (
    <div>
      <div className="section">
        <div className="label">Text inputs</div>
        <div className="row">
          <Input label="Employee ID" placeholder="e1" style={{width:140}} />
          <Input label="With search icon" leftIcon={<SearchIcon/>} placeholder="Search audit log…" style={{width:200}} />
          <Input label="With error" error="Required field" placeholder="Enter value" style={{width:160}} />
          <Input label="Disabled" disabled placeholder="n/a" style={{width:120}} />
        </div>
      </div>
      <div className="section">
        <div className="label">Select</div>
        <div className="row">
          <Select label="Infra mode" options={[{value:'hermes',label:'Hermes'},{value:'openclaw',label:'OpenClaw'}]} style={{width:160}} />
          <Select label="Integration" options={[{value:'mock',label:'Mock'},{value:'real',label:'Real'},{value:'off',label:'Off'}]} style={{width:140}} />
        </div>
      </div>
      <div className="section">
        <div className="label">Textarea</div>
        <Textarea label="Task" rows={2} placeholder="Onboard Maya Cohen (id e1, Engineer, start 2026-07-01)" style={{width:'100%',maxWidth:480}} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
